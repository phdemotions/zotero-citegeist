# Every release starts here, and nowhere else: Actions -> Publish release -> Run workflow, on main,
# with the version and, optionally, the commit. The per-release steps are docs/RELEASE-CHECKLIST.md,
# section 5; recovery, one-time setup and the fork proofs are docs/RELEASE-RUNBOOK.md; the design is
# KTD13 in docs/plans/2026-09-13-001-fix-zotero-10-compat-host-bugs-plan.md.
#
# No workflow runs on a tag push. A push runs the workflow file stored in the pushed commit, so a
# tag on an older commit would run that commit's older release workflow. A dispatch from main runs
# main's copy of this file, and Publish creates the version's tag itself once every gate has passed.
#
#   build        read-only. Refuses a run started anywhere but main, then, before installing
#                anything, a commit that is not a release pull request's merge commit on main or a
#                version main was not developing. Builds that commit with no install scripts;
#                esbuild, inside the build, is the only third-party code it runs. Its outputs (the
#                commit, the tag, the artifact name and the asset digests) are what every later job
#                trusts, and no other job can change them.
#   verify       read-only: typecheck, lint, format, OKF, shellcheck and unit tests, on that commit.
#   real-zotero  read-only: the real-Zotero matrix (real-zotero.yml) on build's XPI, checked
#                against build's digest.
#   publish      after all three. Publishes the exact bytes build made and attests their
#                provenance, creates the version's tag, runs no dependency, test code or Zotero
#                binary, never moves the update channel backwards, and finishes a publish an earlier
#                attempt left half done.
#   badges       after publish. Refreshes the README badges, and can fail and be re-run alone.
#
# test/workflow-invariants.test.ts locks these properties in.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          The version to release, MAJOR.MINOR.PATCH with no v in front, such as 3.0.0. package.json
          at the commit must carry it, and main must have carried its -alpha.0 just before the
          release pull request merged.
        type: string
        required: true
      commit:
        description: >-
          The release pull request's merge commit on main, as its full 40-character SHA. Leave it
          empty to release main as it stands.
        type: string
        required: false
        default: ""

permissions: {}

# GitHub runs `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`. Without it a failure
# anywhere but the end of a pipeline passes.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The release guard reads which pull request put the commit on main.
      pull-requests: read
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.release-guard.outputs.commit }}
      tag: ${{ steps.release-guard.outputs.tag }}
      artifact: ${{ steps.digest.outputs.artifact }}
      asset-sums: ${{ steps.digest.outputs.sums }}
      xpi-sha256: ${{ steps.digest.outputs.xpi-sha256 }}
    steps:
      # The workflow file, and every check it runs, comes from the branch the run started on.
      - name: Started from main
        id: dispatch-ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish release runs only from main, not from $GITHUB_REF: the workflow and its checks come from the branch it runs on. Run it again from main (docs/RELEASE-RUNBOOK.md, \"Guard refusals\")."
            exit 1
          fi
          echo "Started from main at $GITHUB_SHA"

      # main as it was when the run started, with full history. The release guard runs from this
      # copy, never from the release commit's, which may be older.
      - name: Check out main
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No dependency cache: a release restores nothing another run could have written, and
      # setup-node turns caching on by itself once package.json names npm as its package manager.
      - name: Set up Node
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Before anything is installed. Any other commit would publish code review never approved, or
      # a version that has already shipped.
      - name: The commit is a release pull request's merge commit on main
        id: release-guard
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-guard-cli.mjs "$VERSION" "${COMMIT:-$GITHUB_SHA}"

      - name: Check out the release commit
        id: release-checkout
        env:
          COMMIT: ${{ steps.release-guard.outputs.commit }}
        run: git checkout --quiet --detach "$COMMIT"

      # npm install, not npm ci (CLAUDE.md, CI Notes), with no dependency's install script; the
      # build passes without them.
      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Lockfile unchanged by install
        id: lockfile
        run: git diff --exit-code package-lock.json

      # node, not npm run: npm puts node_modules/.bin first on PATH, where a locked package could
      # stand in for git, zip or unzip (test/lockfile.test.ts). The bytes come from the commit
      # alone: build.mjs takes the build id and every file time from the commit, and nothing here
      # sets SOURCE_DATE_EPOCH, so a re-run on the same runner image rebuilds the same XPI.
      - name: Build the release XPI
        id: build
        run: node scripts/build.mjs

      # publish and every real-Zotero cell check the assets against these digests. Any job in the
      # run can write an artifact; none can change these outputs. The attempt number keeps
      # "Re-run all jobs" from colliding with an artifact an earlier attempt uploaded, and every
      # consumer reads the name from here, so "Re-run failed jobs" still finds the first attempt's.
      - name: Record the release asset digests
        id: digest
        working-directory: build
        env:
          ARTIFACT: release-assets-${{ github.run_attempt }}
        run: |
          shopt -s failglob
          xpis=(citegeist-*.xpi)
          if [ "${#xpis[@]}" -ne 1 ]; then echo "::error::Expected one XPI, found: ${xpis[*]}"; exit 1; fi
          sums=$(sha256sum "${xpis[0]}" update.json)
          echo "$sums"
          {
            echo "artifact=$ARTIFACT"
            echo "sums<<CITEGEIST_SUMS"
            echo "$sums"
            echo "CITEGEIST_SUMS"
            echo "xpi-sha256=$(sha256sum "${xpis[0]}" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.digest.outputs.artifact }}
          path: |
            build/citegeist-*.xpi
            build/update.json
          if-no-files-found: error

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # The commit build releases, by the same expression build resolves it with. build refuses any
      # other branch or commit, and publish needs build, so a Verify of anything else publishes
      # nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}

      # No dependency cache, as in build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm install --no-audit --no-fund --ignore-scripts

      - name: Lockfile unchanged by install
        run: git diff --exit-code package-lock.json

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run okf:check

      - run: npm run check:sh

      - run: npm test

  # The matrix pull requests run, on the XPI build made rather than a rebuild, so the suite tests
  # the bytes publish ships, with the release commit's own specs.
  real-zotero:
    name: Real Zotero
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/real-zotero.yml
    with:
      ref: ${{ needs.build.outputs.commit }}
      xpi-artifact: ${{ needs.build.outputs.artifact }}
      xpi-sha256: ${{ needs.build.outputs.xpi-sha256 }}

  publish:
    name: Publish
    needs: [build, verify, real-zotero]
    runs-on: ubuntu-24.04
    permissions:
      # Pushes the version's tag and the channel's `release` tag, and creates the release.
      contents: write
      # With attestations: write, signs and stores the provenance attestation for the assets.
      id-token: write
      attestations: write
    timeout-minutes: 15
    # One publish at a time across every run, so two runs cannot interleave the channel check and
    # the channel move. A running publish is never cancelled, and with queue: max a waiting one is
    # not either: up to 100 wait, and run in the order they started waiting.
    concurrency:
      group: release-channel
      cancel-in-progress: false
      queue: max
    env:
      TAG: ${{ needs.build.outputs.tag }}
      COMMIT: ${{ needs.build.outputs.commit }}
      SUMS: ${{ needs.build.outputs.asset-sums }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the release assets
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release-assets

      # After the download, so the workspace holds this workflow's own commit, main as the run
      # found it, and nothing the artifact carried; publish's scripts come from here. Full
      # history, so the release commit is here to tag. Credentials persist on purpose: the tag
      # steps push.
      - name: Check out the workflow's commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      # Nothing is written until the downloaded bytes are proven to be build's.
      - name: Confirm the assets are the bytes build made
        id: digest-check
        run: bash scripts/verify-release-assets.sh "$RUNNER_TEMP/release-assets"

      # A tag an earlier attempt created on this commit is kept; one on any other commit means the
      # version is taken. The tag itself is created below, once every check has passed.
      - name: The version's tag is absent or already on this commit
        id: tag-state
        run: |
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          printf '%s\n' "$refs"
          if [ -z "$refs" ]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "$TAG does not exist yet; publish creates it on $COMMIT once every check passes"
          # An annotated tag lists its tag object, then its commit under ^{}.
          elif printf '%s\n' "$refs" | awk -v sha="$COMMIT" -v ref="refs/tags/$TAG" \
            '$1 == sha && ($2 == ref || $2 == (ref "^{}")) { found = 1 } END { exit !found }'; then
            echo "state=present" >> "$GITHUB_OUTPUT"
            echo "$TAG already points at $COMMIT, from an earlier attempt"
          else
            echo "::error::$TAG already exists on another commit, so $COMMIT cannot be released as ${TAG#v}. A version is released once (docs/RELEASE-RUNBOOK.md, \"Publish refusals\")."
            exit 1
          fi

      # Refuses a version older than the channel's newest, and this version with other bytes. It
      # reports "current" when an earlier attempt already published these exact bytes, and
      # "repair" when it may restore a missing update.json.
      - name: The live channel accepts this version
        id: channel-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-channel-version-cli.mjs "${TAG#v}" "https://github.com/$GITHUB_REPOSITORY/releases/download/release/update.json"

      # Before anything is published, so every published byte has a provenance attestation.
      # Anyone can check one with `gh attestation verify <file> --repo <owner>/<name>`
      # (docs/RELEASE-RUNBOOK.md, "Verifying a release").
      - name: Attest the assets' build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-assets/citegeist-*.xpi
            ${{ runner.temp }}/release-assets/update.json

      # The first write. The tag is a GITHUB_TOKEN push, which starts no workflow run.
      - name: Create the version's tag
        id: tag
        env:
          TAG_STATE: ${{ steps.tag-state.outputs.state }}
        run: |
          case "$TAG_STATE" in
            present)
              echo "$TAG already points at $COMMIT; nothing to create"
              exit 0
              ;;
            absent) ;;
            *)
              echo "::error::The tag check reported '$TAG_STATE', which this step does not know"
              exit 1
              ;;
          esac
          git tag "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"

      # Creates the release, or settles the one an earlier attempt left: a published release is
      # never changed, and a draft is published or replaced.
      - name: Create or settle the versioned release
        id: versioned-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-versioned-release.sh "$TAG" "$RUNNER_TEMP/release-assets"

      - name: Move the auto-update channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_STATE: ${{ steps.channel-version.outputs.state }}
        run: |
          case "$CHANNEL_STATE" in
            current)
              echo "The channel already serves $TAG's verified update.json; nothing to move"
              exit 0
              ;;
            advance | first | repair) ;;
            *)
              echo "::error::The channel check reported '$CHANNEL_STATE', which this step does not know"
              exit 1
              ;;
          esac
          # Move the floating `release` tag to the release commit.
          git tag -f release "$COMMIT"
          git push --force origin refs/tags/release:refs/tags/release
          bash scripts/publish-update-channel.sh "$RUNNER_TEMP/release-assets/update.json"

  badges:
    name: README badges
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      # Pushes the `badges` branch.
      contents: write
    timeout-minutes: 10
    # One refresh at a time. Each reads every release when it runs, so a pending refresh GitHub
    # cancels in favour of a newer one loses nothing.
    concurrency:
      group: readme-badges
      cancel-in-progress: false
    steps:
      # Credentials persist on purpose: this job pushes the `badges` branch.
      - name: Check out the workflow's commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      # The README's release and downloads badges are shields endpoint badges that read JSON from
      # the orphan `badges` branch over raw.githubusercontent.com, so shields never spends GitHub
      # API tokens on them (its shared token pool froze the old github/* badges). shields refuses
      # github.com release-asset URLs as endpoint sources, hence a branch, force-pushed as one
      # fresh root commit.
      - name: Refresh the README badges
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # --slurp returns one array of pages, so no release past the first 100 is lost.
          gh api --paginate --slurp -H "X-GitHub-Api-Version: 2022-11-28" "repos/$REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node scripts/readme-badges-cli.mjs "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/badges"
          git worktree add --detach "$RUNNER_TEMP/cg-badges" HEAD
          cd "$RUNNER_TEMP/cg-badges"
          git checkout --orphan badges-tmp
          git rm -rf . --quiet
          cp "$RUNNER_TEMP/badges/badge-release.json" "$RUNNER_TEMP/badges/badge-downloads.json" .
          git add badge-release.json badge-downloads.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(badges): refresh after $TAG"
          git push --force origin badges-tmp:badges
