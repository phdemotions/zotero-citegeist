name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Node 22 LTS only — vitest 4.x + std-env 4.x require Node >=22.19
        # and package.json `engines.node` is pinned to ">=22.0.0".
        node-version: [22]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: OKF docs check
        run: npm run okf:check

      - run: npm test

      - run: npm run typecheck

      - run: npm run build

  # The real-Zotero matrix (plan U4), defined once in real-zotero.yml and also
  # called by release.yml. Each cell reports as "Real Zotero / Zotero <version>".
  real-zotero:
    name: Real Zotero
    permissions:
      contents: read
    uses: ./.github/workflows/real-zotero.yml

  # The one check branch protection requires on main. It fails unless every job
  # above succeeded, so adding or bumping a Zotero cell needs no settings change.
  # always() matters: a skipped required check counts as passing.
  gate:
    name: CI gate
    needs: [test, real-zotero]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with result '$result'"
              exit 1
            fi
          done
