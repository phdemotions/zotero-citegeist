name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# GitHub runs `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`. Without
# it a failure anywhere but the end of a pipeline passes.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node 22 LTS only — vitest 4.x + std-env 4.x require Node >=22.19
        # and package.json `engines.node` is pinned to ">=22.0.0".
        node-version: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The install, and in order the gates, that release.yml's build and verify
      # jobs run: npm install, not npm ci (CLAUDE.md, CI Notes), with no dependency
      # install script.
      - run: npm install --no-audit --no-fund --ignore-scripts

      - name: Lockfile unchanged by install
        run: git diff --exit-code package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: OKF docs check
        run: npm run okf:check

      - name: Shell script check
        run: shellcheck scripts/*.sh

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The real-Zotero matrix, defined once in real-zotero.yml and also called by
  # release.yml. Each cell reports as "Real Zotero / Zotero <version>". No inputs:
  # pull requests build their own XPI and run the default matrix.
  real-zotero:
    name: Real Zotero
    permissions:
      contents: read
    uses: ./.github/workflows/real-zotero.yml

  # The one check branch protection requires on main. It fails unless every job
  # above succeeded, so adding or bumping a Zotero cell needs no settings change.
  # always() matters: a skipped required check counts as passing.
  gate:
    name: CI gate
    needs: [test, real-zotero]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "::error::No job results reached the gate"
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with result '$result'"
              exit 1
            fi
          done
