# Tag push -> gated release. The procedure is docs/RELEASE-CHECKLIST.md, section 5;
# the design is KTD13 in docs/plans/2026-09-13-001-fix-zotero-10-compat-host-bugs-plan.md.
#
#   build        read-only. Refuses every tag but a release pull request's merge
#                commit on main, then installs with no install scripts and builds.
#                esbuild, inside the build, is the only third-party code it runs.
#                Its outputs, the artifact name and the asset digests, are what
#                every later job trusts, and no other job can change them.
#   verify       read-only: typecheck, lint, format, OKF, shellcheck, unit tests.
#   real-zotero  read-only: the real-Zotero matrix (real-zotero.yml) on build's XPI,
#                checked against build's digest.
#   publish      contents: write, after all three. Publishes the exact bytes build
#                made, runs no dependency, test code, Zotero binary or third-party
#                action, never moves the update channel backwards, and finishes a
#                publish an earlier attempt left half done.
#   badges       contents: write, after publish. Refreshes the README badges, and
#                can fail and be re-run on its own.
#
# test/workflow-invariants.test.ts locks these properties in.
name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# GitHub runs `shell: bash` as `bash --noprofile --norc -eo pipefail {0}`. Without
# it a failure anywhere but the end of a pipeline passes.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The release guard reads which pull request put the tagged commit on main.
      pull-requests: read
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.digest.outputs.artifact }}
      asset-sums: ${{ steps.digest.outputs.sums }}
      xpi-sha256: ${{ steps.digest.outputs.xpi-sha256 }}
    steps:
      # Full history: the release guard walks main's first-parent history and reads
      # package.json at the release pull request's base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No dependency cache: a release restores nothing another run could have written.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Before anything is installed. A tag on any other commit would publish code
      # review never approved, or a version that has already shipped.
      - name: The tag is a release pull request's merge commit on main
        id: release-guard
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-guard-cli.mjs "$TAG" "$GITHUB_SHA"

      # npm install, not npm ci (CLAUDE.md, CI Notes), with no dependency's install
      # script; the build passes without them.
      - run: npm install --no-audit --no-fund --ignore-scripts

      - name: Lockfile unchanged by install
        run: git diff --exit-code package-lock.json

      - run: npm run build

      # publish and every real-Zotero cell check the assets against these digests.
      # Any job in the run can write an artifact; none can change these outputs. The
      # attempt number keeps "Re-run all jobs" from colliding with an artifact an
      # earlier attempt uploaded, and publish reads the name from here, so "Re-run
      # failed jobs" still finds the first attempt's artifact.
      - name: Record the release asset digests
        id: digest
        working-directory: build
        env:
          ARTIFACT: release-assets-${{ github.run_attempt }}
        run: |
          shopt -s failglob
          xpis=(citegeist-*.xpi)
          if [ "${#xpis[@]}" -ne 1 ]; then echo "::error::Expected one XPI, found: ${xpis[*]}"; exit 1; fi
          sums=$(sha256sum "${xpis[0]}" update.json)
          echo "$sums"
          {
            echo "artifact=$ARTIFACT"
            echo "sums<<CITEGEIST_SUMS"
            echo "$sums"
            echo "CITEGEIST_SUMS"
            echo "xpi-sha256=$(sha256sum "${xpis[0]}" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.digest.outputs.artifact }}
          path: |
            build/citegeist-*.xpi
            build/update.json
          if-no-files-found: error

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache, as in build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund --ignore-scripts

      - name: Lockfile unchanged by install
        run: git diff --exit-code package-lock.json

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run okf:check

      - run: shellcheck scripts/*.sh

      - run: npm test

  # The matrix pull requests run, on the XPI build made rather than a rebuild, so
  # the suite tests the bytes publish ships.
  real-zotero:
    name: Real Zotero
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/real-zotero.yml
    with:
      xpi-artifact: ${{ needs.build.outputs.artifact }}
      xpi-sha256: ${{ needs.build.outputs.xpi-sha256 }}

  publish:
    name: Publish
    needs: [build, verify, real-zotero]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    # One publish at a time across all tags, so two runs cannot interleave the
    # channel check and the channel move. A running publish is never cancelled.
    # GitHub keeps only the newest pending one and cancels older pending ones, so
    # after a release, re-run any Publish shown as cancelled
    # (docs/RELEASE-CHECKLIST.md, section 5).
    concurrency:
      group: release-channel
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      SUMS: ${{ needs.build.outputs.asset-sums }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the release assets
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release-assets

      # After the download, so the workspace holds the tagged commit and nothing the
      # artifact carried. Credentials persist on purpose: the channel step pushes
      # the `release` tag.
      - name: Check out the tagged commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing is written until the downloaded bytes are proven to be build's.
      - name: Confirm the assets are the bytes build made
        id: digest-check
        run: bash scripts/verify-release-assets.sh "$RUNNER_TEMP/release-assets"

      # A re-run of a superseded run, or a tag deleted and pushed again on another
      # commit, must not publish this run's commit.
      - name: The tag still points at this run's commit
        id: tag-current
        run: |
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          printf '%s\n' "$refs"
          # An annotated tag lists its tag object, then its commit under ^{}.
          if ! printf '%s\n' "$refs" | awk -v sha="$GITHUB_SHA" -v ref="refs/tags/$TAG" \
            '$1 == sha && ($2 == ref || $2 == (ref "^{}")) { found = 1 } END { exit !found }'; then
            echo "::error::Tag $TAG no longer points at this run's commit $GITHUB_SHA. Re-run only the newest run for a tag (docs/RELEASE-CHECKLIST.md, section 5)."
            exit 1
          fi
          echo "Tag $TAG still points at $GITHUB_SHA"

      # Refuses a version older than the channel's newest, and this version with
      # other bytes. It reports "current" when an earlier attempt already published
      # these exact bytes, and "repair" when it may restore a missing update.json.
      # It runs before the versioned release exists, so a refused tag creates nothing.
      - name: The live channel accepts this version
        id: channel-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-channel-version-cli.mjs "${TAG#v}" "https://github.com/$GITHUB_REPOSITORY/releases/download/release/update.json"

      # Creates the release, or settles the one an earlier attempt left: a published
      # release is never changed, and a draft is published or replaced.
      - name: Create or settle the versioned release
        id: versioned-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-versioned-release.sh "$TAG" "$RUNNER_TEMP/release-assets"

      - name: Move the auto-update channel
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_STATE: ${{ steps.channel-version.outputs.state }}
        run: |
          case "$CHANNEL_STATE" in
            current)
              echo "The channel already serves $TAG's verified update.json; nothing to move"
              exit 0
              ;;
            advance | first | repair) ;;
            *)
              echo "::error::The channel check reported '$CHANNEL_STATE', which this step does not know"
              exit 1
              ;;
          esac
          # Move the floating `release` tag to this commit.
          git tag -f release
          git push --force origin refs/tags/release:refs/tags/release
          bash scripts/publish-update-channel.sh "$RUNNER_TEMP/release-assets/update.json"

  badges:
    name: README badges
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    # One refresh at a time. Each reads every release when it runs, so a pending
    # refresh GitHub cancels in favour of a newer one loses nothing.
    concurrency:
      group: readme-badges
      cancel-in-progress: false
    steps:
      # Credentials persist on purpose: this job pushes the `badges` branch.
      - name: Check out the tagged commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The README's release and downloads badges are shields endpoint badges that
      # read JSON from the orphan `badges` branch over raw.githubusercontent.com, so
      # shields never spends GitHub API tokens on them (its shared token pool froze
      # the old github/* badges). shields refuses github.com release-asset URLs as
      # endpoint sources, hence a branch, force-pushed as one fresh root commit.
      - name: Refresh the README badges
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # --slurp returns one array of pages, so no release past the first 100 is lost.
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node scripts/readme-badges-cli.mjs "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/badges"
          git worktree add --detach "$RUNNER_TEMP/cg-badges" HEAD
          cd "$RUNNER_TEMP/cg-badges"
          git checkout --orphan badges-tmp
          git rm -rf . --quiet
          cp "$RUNNER_TEMP/badges/badge-release.json" "$RUNNER_TEMP/badges/badge-downloads.json" .
          git add badge-release.json badge-downloads.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(badges): refresh after $TAG"
          git push --force origin badges-tmp:badges
